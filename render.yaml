services:
  - type: web
    name: entertainment-api
    runtime: node
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODBURL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true

  - type: web
    name: entertainment-client
    runtime: static
    rootDir: Client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
